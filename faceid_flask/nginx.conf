# /etc/nginx/sites-available/faceid
# Symlink: sudo ln -s /etc/nginx/sites-available/faceid /etc/nginx/sites-enabled/
# After SSL cert: sudo certbot --nginx -d yourdomain.com

server {
    listen 80;
    server_name yourdomain.com;

    # Redirect HTTP → HTTPS (uncomment after SSL cert)
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;

    # ── Static files served directly by Nginx ──
    location /static/ {
        alias /path/to/faceid_flask/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── SocketIO (requires upgrade headers) ──
    location /socket.io/ {
        proxy_pass         http://127.0.0.1:5000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 86400;
    }

    # ── Flask app ──
    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }
}

